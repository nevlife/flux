# Atomics only where a file opts in with an allow that says why: the shared words and their
# orderings stay in the few files the design's ordering tables cover.
disallowed-types = [
    "core::sync::atomic::AtomicBool",
    "core::sync::atomic::AtomicI8",
    "core::sync::atomic::AtomicI16",
    "core::sync::atomic::AtomicI32",
    "core::sync::atomic::AtomicI64",
    "core::sync::atomic::AtomicIsize",
    "core::sync::atomic::AtomicU8",
    "core::sync::atomic::AtomicU16",
    "core::sync::atomic::AtomicU32",
    "core::sync::atomic::AtomicU64",
    "core::sync::atomic::AtomicUsize",
    "core::sync::atomic::AtomicPtr",
    "core::sync::atomic::Ordering",
]
disallowed-methods = ["core::sync::atomic::fence"]
